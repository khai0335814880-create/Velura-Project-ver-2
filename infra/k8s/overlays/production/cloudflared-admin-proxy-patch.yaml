apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-admin
  namespace: velura
spec:
  template:
    spec:
      containers:
        - name: origin-proxy
          image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: origin-admin
              containerPort: 5174
          volumeMounts:
            - name: origin-proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: origin-proxy-tls
              mountPath: /etc/nginx/tls
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: origin-proxy-config
          configMap:
            name: cloudflared-origin-proxy
        - name: origin-proxy-tls
          secret:
            secretName: cloudflared-origin-tls
