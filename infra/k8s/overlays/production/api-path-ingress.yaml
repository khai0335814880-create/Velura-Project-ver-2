apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velura-api-paths
  namespace: velura
spec:
  ingressClassName: traefik
  rules:
    - host: velura.royalai.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
          - path: /health
            pathType: Exact
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
    - host: admin.royalai.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
          - path: /health
            pathType: Exact
            backend:
              service:
                name: velura-api
                port:
                  number: 8787
