apiVersion: apps/v1
kind: Deployment
metadata:
  name: velura-admin-web
  namespace: velura
spec:
  replicas: 1
  selector:
    matchLabels: { app: velura-admin-web }
  template:
    metadata:
      labels: { app: velura-admin-web }
    spec:
      containers:
        - name: admin-web
          image: localhost:5000/velura-admin-web:prod-20260721-5
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
